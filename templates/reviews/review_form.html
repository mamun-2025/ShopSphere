

{% extends "accounts/base.html" %}

{% block content %}

<div class="container mt-5">
   <div class="row justify-content-center">
      <div class="col-md-8">
         <div class="card shadow-sm">
            <div class="card-body">
               
               <h2 class="mb-4">
                  Write a Review
               </h2>

               <p class="muted">
                  Product: {{ view.product.name }}
               </p>

               <form method="post">

                  {% csrf_token %}

                  {{ form.as_p }}

                  <button 
                     type="submit"
                     class="btn btn-primary"
                  >
                  Submit Review
                  </button>

                  <a 
                     href="{% url 'product_detail' view.product.slug %}"
                     class="btn btn-secondary"
                  >
                  Cancel
                  </a>

               </form>

            </div>
         </div>
      </div>
   </div>
</div>
{% endblock %}
