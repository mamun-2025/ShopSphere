

<!DOCTYPE html>
<html>
<head>
   <title>ShopSphere</title>
   
   <link 
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
         rel="stylesheet"
   >

</head>
<body>

<!-- ========================= 
   Navigation Bar 
   ========================= -->
<div class="navbar navbar-expand-lg navbar-light bg-light mb-4">
   <div class="container">
      <a class="navbar-brand"
         href="/"
      >
         ShopSphere
      </a>

      <div>
         <a 
            href="{% url 'category_list' %}"
            class="btn btn-primary"
         >
         Categories
         </a>

         <a 
            href="{% url 'product_list' %}"
            class="btn btn-primary"
         >
         Products
         </a>

         
         {% if request.user.is_authenticated %}
            <a 
               href="{% url 'accounts:profile' %}"
               class="btn btn-success"
            >
            Profile
            </a>
            <a 
               href="{% url 'accounts:edit_profile' %}"
               class="btn btn-warning"
            >
            Edit Profile
            </a>
            <a 
               href="{% url 'accounts:logout' %}"
               class="btn btn-danger"
            >
            Logout
            </a>
            <a 
               href="{% url 'accounts:change_password' %}"
               class="btn btn-info"
            >
            Change Password
            </a>

         {% else %}
            <a 
               href="{% url 'accounts:login' %}"
               class="btn btn-primary"
            >
            Login
            </a>
            <a 
               href="{% url 'accounts:register' %}"
               class="btn btn-success"
            >
            Register
            </a>
         {% endif %}
      </div>
   </div>
</div>
   
      
   

<!-- ====================
    Main Content
    ==================== -->
<div class="container mt-4">

   {% if messages %}

      {% for message in messages %}

         <div 
            class="alert alert-{{ message.tags }} alert-dimissible fade show"
            role="alert"
         >

            {{ message }}

            <button
               type="button"
               class="btn-close"
               class-bs-dimiss="alert"
               alert-label="Close"
            ></button>

         </div>



      {% endfor %}

   {% endif %}


   {% block content %}

   
   {% endblock %}

</div>
   

<script 
   src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
