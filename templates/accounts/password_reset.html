
{% extends "accounts/base.html" %}

{% block content %}

<p>Enter your email address below and we will send your password-reset link.</p>

<h2>Password Reset</h2>

<form method="post">

   {% csrf_token %}

   {{ form.as_p }}

   <button 
      type="submit"
      class="btn btn-primary"
   >
   Send Password Reset Link  
   </button>

</form>

{% endblock %}
