

{% extends "accounts/base.html" %}

{% block content %}


<div class="container">
   <div class="row justify-content-center">
      <div class="col-md-6">
         <div class="card-shadow">
            <div class="card-body">
               <h2 class="mb-4">
                  Delete Product
               </h2>
               <div class="alert alert-danger">
                  <strong>Warning!</strong>
                  Are you sure you want to delete this product?
               </div>
               <div class="mb-4">
                  <p>
                     <strong>Product Name:</strong>
                     {{ product.name }}
                  </p>
                   <p>
                     <strong>SKU:</strong>
                     {{ product.sku }}
                  </p>
                   <p>
                     <strong>Price:</strong>
                     {{ product.price }}
                  </p>
                   <p>
                     <strong>Stock:</strong>
                     {{ product.stock }}
                  </p>

               </div>

               <form method="post">

                  {% csrf_token %}


                  <button 
                     type="submit"
                     class="btn btn-primary"
                  >
                  Yes, Delete
                  </button>
                  <a 
                     href="{% url 'product_list' %}"
                     class="btn btn-secondary"
                  >
                  Cancel 
                  </a>

               </form>

            </div>
         </div>
      </div>
   </div>
</div>



{% endblock %}
